<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Favicon & Touch Icon ─────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── Viewport ──────────────────────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Primary Meta ──────────────────────────────────────────────────── -->
    <title>Pabs — The Modern Bhabhi Card Game</title>
    <meta name="description"
      content="Pabs is the modern multiplayer version of Bhabhi. Play with 3 to 8 friends on any device — no download required." />
    <meta name="author" content="Pabs" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pabs.vercel.app" />

    <!-- ── Open Graph ─────────────────────────────────────────────────────── -->
    <meta property="og:type"         content="website" />
    <meta property="og:site_name"    content="Pabs" />
    <meta property="og:title"        content="Pabs — The Modern Bhabhi Card Game" />
    <meta property="og:description"  content="The modern multiplayer version of Bhabhi. Play with 3 to 8 friends on any device — no download required." />
    <meta property="og:url"          content="https://pabs.vercel.app" />
    <meta property="og:image"        content="https://pabs.vercel.app/og.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type"   content="image/png" />
    <meta property="og:image:alt"    content="Pabs — The Modern Bhabhi Card Game" />

    <!-- ── Twitter / X Card ──────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Pabs — The Modern Bhabhi Card Game" />
    <meta name="twitter:description" content="The modern multiplayer version of Bhabhi. Play with 3 to 8 friends on any device — no download required." />
    <meta name="twitter:image"       content="https://pabs.vercel.app/og.png" />

    <!-- ── PWA / Mobile ──────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#0f0d0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pabs" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Fonts ─────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
