<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Favicon & Touch Icon ─────────────────────────────────────────── -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- ── Viewport ──────────────────────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Primary Meta ──────────────────────────────────────────────────── -->
    <title>Join a Game on Pabs</title>
    <meta name="description"
      content="You've been invited to a game of Pabs — the modern version of Bhabhi. Tap to join. No download required." />
    <meta name="author" content="Pabs" />
    <meta name="robots" content="noindex" />

    <!-- ── Open Graph ─────────────────────────────────────────────────────── -->
    <meta property="og:type"         content="website" />
    <meta property="og:site_name"    content="Pabs" />
    <meta property="og:title"        content="Join a Game on Pabs" />
    <meta property="og:description"  content="You've been invited to a game of Pabs — the modern version of Bhabhi. Tap to join. No download required." />
    <meta property="og:image"        content="https://playpabs.vercel.app/og.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type"   content="image/png" />
    <meta property="og:image:alt"    content="Pabs — The Modern Bhabhi Card Game" />

    <!-- ── Twitter / X Card ──────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Join a Game on Pabs" />
    <meta name="twitter:description" content="You've been invited to a game of Pabs — the modern version of Bhabhi. Tap to join. No download required." />
    <meta name="twitter:image"       content="https://playpabs.vercel.app/og.png" />

    <!-- ── PWA / Mobile ──────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#0f0d0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pabs" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Fonts ─────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
